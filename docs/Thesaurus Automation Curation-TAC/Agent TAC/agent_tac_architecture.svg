<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930"><defs><marker id="a334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="ac2662d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c2662d"/></marker><marker id="a2c5a85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2c5a85"/></marker><marker id="aa8457a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a8457a"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="560" y="20" width="280" height="75" rx="10" fill="#fbe6d9" stroke="#c2662d" stroke-width="2.5"/><g fill="#c2662d"><circle cx="600" cy="51" r="8"/><path d="M585 75 Q585 60 600 60 Q615 60 615 75 Z"/></g><text x="715" y="48" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2433" text-anchor="middle" dominant-baseline="middle">Utilisateur</text><text x="715" y="72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5568" text-anchor="middle" dominant-baseline="middle">documentaliste ou spécialiste</text><path d="M700 95 V136" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a334155)"/><text x="712" y="116" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5568" text-anchor="start" dominant-baseline="middle">requête en langage naturel</text><rect x="420" y="140" width="560" height="135" rx="10" fill="#1e2633" stroke="#1e2633" stroke-width="2"/><text x="700" y="180" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Agent TAC</text><text x="700" y="210" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14.5" fill="#e5e7eb" text-anchor="middle" dominant-baseline="middle">analyse la requête et choisit l&#x27;outil adapté</text><text x="700" y="231" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14.5" fill="#e5e7eb" text-anchor="middle" dominant-baseline="middle">sélectionne la base vectorielle, les relations et le modèle</text><text x="700" y="252" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14.5" fill="#e5e7eb" text-anchor="middle" dominant-baseline="middle">présente le contexte et le résultat à l&#x27;utilisateur</text><path d="M700 275 V310" fill="none" stroke="#334155" stroke-width="2"/><path d="M220 310 H1180" fill="none" stroke="#334155" stroke-width="2"/><path d="M220.0 310 V336" fill="none" stroke="#2c5a85" stroke-width="2" marker-end="url(#a2c5a85)"/><rect x="75" y="340" width="290" height="165" rx="10" fill="#e3edf7" stroke="#2c5a85" stroke-width="2.5"/><circle cx="347" cy="358" r="13" fill="#2c5a85"/><path d="M341 358 L345 363 L353 353" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="210.0" y="374" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1d2433" text-anchor="middle" dominant-baseline="middle">1. Génération de concepts</text><text x="220.0" y="402" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5568" text-anchor="middle" dominant-baseline="middle">propose un concept SKOS complet :</text><text x="220.0" y="422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5568" text-anchor="middle" dominant-baseline="middle">prefLabel, altLabel, définition,</text><text x="220.0" y="442" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5568" text-anchor="middle" dominant-baseline="middle">broader et narrower</text><rect x="160.0" y="471" width="120" height="22" rx="11" fill="#2c5a85"/><text x="220.0" y="483" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">développé</text><path d="M540.0 310 V336" fill="none" stroke="#a8457a" stroke-width="2" marker-end="url(#aa8457a)"/><rect x="395" y="340" width="290" height="165" rx="10" fill="#f7e4ee" stroke="#a8457a" stroke-width="2.5"/><circle cx="667" cy="358" r="13" fill="#a8457a"/><path d="M661 358 L665 363 L673 353" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="530.0" y="374" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1d2433" text-anchor="middle" dominant-baseline="middle">2. Rattachement aux thésaurus</text><text x="540.0" y="402" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5568" text-anchor="middle" dominant-baseline="middle">propose le thésaurus auquel</text><text x="540.0" y="422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5568" text-anchor="middle" dominant-baseline="middle">un concept doit être rattaché</text><rect x="480.0" y="471" width="120" height="22" rx="11" fill="#a8457a"/><text x="540.0" y="483" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">développé</text><path d="M860.0 310 V336" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a334155)"/><rect x="715" y="340" width="290" height="165" rx="10" fill="#f0f1f3" stroke="#9aa0a8" stroke-width="2" stroke-dasharray="7 5"/><circle cx="987" cy="358" r="13" fill="#9aa0a8"/><text x="987" y="359" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">?</text><text x="850.0" y="374" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">3. Alignement des thésaurus</text><text x="860.0" y="402" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">relie les thésaurus construits</text><text x="860.0" y="422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">avec le LLM aux thésaurus</text><text x="860.0" y="442" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">et référentiels externes</text><rect x="800.0" y="471" width="120" height="22" rx="11" fill="#9aa0a8"/><text x="860.0" y="483" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">à implémenter</text><path d="M1180.0 310 V336" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a334155)"/><rect x="1035" y="340" width="290" height="165" rx="10" fill="#f0f1f3" stroke="#9aa0a8" stroke-width="2" stroke-dasharray="7 5"/><circle cx="1307" cy="358" r="13" fill="#9aa0a8"/><text x="1307" y="359" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">?</text><text x="1170.0" y="374" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">4. Export au format SKOS</text><text x="1180.0" y="402" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">exporte le thésaurus validé</text><text x="1180.0" y="422" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">au format SKOS (RDF)</text><rect x="1120.0" y="471" width="120" height="22" rx="11" fill="#9aa0a8"/><text x="1180.0" y="483" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">à implémenter</text><rect x="40" y="560" width="1320" height="210" rx="14" fill="#eef6f0" stroke="#9cc7a8" stroke-width="2"/><text x="62" y="585" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1d2433" text-anchor="start" dominant-baseline="middle">Ressources utilisées par les outils</text><rect x="70" y="615" width="300" height="130" rx="10" fill="#fff" stroke="#3f8f63" stroke-width="2"/><text x="220.0" y="648" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2433" text-anchor="middle" dominant-baseline="middle">Qdrant</text><text x="220.0" y="680" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5568" text-anchor="middle" dominant-baseline="middle">bases vectorielles</text><text x="220.0" y="701" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5568" text-anchor="middle" dominant-baseline="middle">de concepts et de thésaurus</text><rect x="390" y="615" width="300" height="130" rx="10" fill="#fff" stroke="#3f8f63" stroke-width="2"/><text x="540.0" y="648" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2433" text-anchor="middle" dominant-baseline="middle">Neo4j</text><text x="540.0" y="680" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5568" text-anchor="middle" dominant-baseline="middle">graphe de connaissances :</text><text x="540.0" y="701" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5568" text-anchor="middle" dominant-baseline="middle">broader, narrower, appartient à</text><rect x="710" y="615" width="300" height="130" rx="10" fill="#fff" stroke="#3f8f63" stroke-width="2"/><text x="860.0" y="648" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2433" text-anchor="middle" dominant-baseline="middle">Modèles fine-tunés</text><text x="860.0" y="680" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5568" text-anchor="middle" dominant-baseline="middle">Mistral 7B concepts</text><text x="860.0" y="701" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5568" text-anchor="middle" dominant-baseline="middle">Mistral 7B thésaurus</text><rect x="1030" y="615" width="300" height="130" rx="10" fill="#fff" stroke="#3f8f63" stroke-width="2"/><text x="1180.0" y="648" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2433" text-anchor="middle" dominant-baseline="middle">API OpenTheso</text><text x="1180.0" y="680" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5568" text-anchor="middle" dominant-baseline="middle">lecture des thésaurus existants</text><text x="1180.0" y="701" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5568" text-anchor="middle" dominant-baseline="middle">et enregistrement des résultats</text><path d="M220 505 V556" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a334155)"/><path d="M540 505 V556" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a334155)"/><path d="M860 505 V556" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a334155)"/><path d="M1180 505 V556" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a334155)"/><rect x="40" y="815" width="1320" height="90" rx="12" fill="#fbe6d9" stroke="#c2662d" stroke-width="2.5"/><g fill="#c2662d"><circle cx="90" cy="851" r="8"/><path d="M75 875 Q75 860 90 860 Q105 860 105 875 Z"/></g><text x="125" y="846" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2433" text-anchor="start" dominant-baseline="middle">Validation humaine dans la boucle</text><text x="125" y="872" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#4a5568" text-anchor="start" dominant-baseline="middle">l&#x27;utilisateur vérifie et corrige le contexte construit par l&#x27;agent, puis valide le résultat avant son enregistrement dans OpenTheso</text><path d="M700 770 V811" fill="none" stroke="#c2662d" stroke-width="2" marker-end="url(#ac2662d)"/></svg>