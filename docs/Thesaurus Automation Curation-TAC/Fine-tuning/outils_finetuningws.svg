<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550"><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:12.5px;fill:#1d2433;text-anchor:start}.h{fill:#fff;font-weight:700;text-anchor:middle}.b{font-weight:600}rect{stroke:#d5d9e0}.H{fill:#2a3f5f}.A{fill:#f3f5f9}.W{fill:#fff}</style><rect width="1040" height="550" fill="#fff" stroke="none"/><rect x="20" y="20" width="200" height="28" class="H"/><text x="120.0" y="38.0" class="h">Étape</text><rect x="220" y="20" width="360" height="28" class="H"/><text x="400.0" y="38.0" class="h">Outil / technologie</text><rect x="580" y="20" width="440" height="28" class="H"/><text x="800.0" y="38.0" class="h">Rôle</text><rect x="20" y="48" width="200" height="28" class="A"/><text x="32" y="66.0" class="b">Langage</text><rect x="220" y="48" width="360" height="28" class="A"/><text x="232" y="66.0">Python 3.11 (Conda)</text><rect x="580" y="48" width="440" height="28" class="A"/><text x="592" y="66.0">Langage de tout le projet</text><rect x="20" y="76" width="200" height="28" class="W"/><text x="32" y="94.0" class="b">Environnement</text><rect x="220" y="76" width="360" height="28" class="W"/><text x="232" y="94.0">Jupyter Notebook</text><rect x="580" y="76" width="440" height="28" class="W"/><text x="592" y="94.0">Lancement de l'entraînement (Fine-tuning.ipynb)</text><rect x="20" y="104" width="200" height="45" class="A"/><text x="32" y="130.5" class="b">Matériel</text><rect x="220" y="104" width="360" height="45" class="A"/><text x="232" y="122.0">2 × NVIDIA H100 NVL (94 Go de mémoire chacun),</text><text x="232" y="139.0">CUDA 13.0, pilote 580.178.04, serveur Linux</text><rect x="580" y="104" width="440" height="45" class="A"/><text x="592" y="130.5">Calcul de l'entraînement et de l'inférence</text><rect x="20" y="149" width="200" height="28" class="W"/><text x="32" y="167.0" class="b">Source des données</text><rect x="220" y="149" width="360" height="28" class="W"/><text x="232" y="167.0">API Opentheso</text><rect x="580" y="149" width="440" height="28" class="W"/><text x="592" y="167.0">Extraction des concepts et des thésaurus</text><rect x="20" y="177" width="200" height="28" class="A"/><text x="32" y="195.0" class="b">Préparation des données</text><rect x="220" y="177" width="360" height="28" class="A"/><text x="232" y="195.0">pandas</text><rect x="580" y="177" width="440" height="28" class="A"/><text x="592" y="195.0">Lecture des CSV et construction des paires question / réponse</text><rect x="20" y="205" width="200" height="28" class="W"/><text x="32" y="223.0" class="b">Préparation des données</text><rect x="220" y="205" width="360" height="28" class="W"/><text x="232" y="223.0">Hugging Face Datasets</text><rect x="580" y="205" width="440" height="28" class="W"/><text x="592" y="223.0">Chargement des fichiers .jsonl (train / val / test)</text><rect x="20" y="233" width="200" height="28" class="A"/><text x="32" y="251.0" class="b">Modèles de base</text><rect x="220" y="233" width="360" height="28" class="A"/><text x="232" y="251.0">Hugging Face Hub</text><rect x="580" y="233" width="440" height="28" class="A"/><text x="592" y="251.0">Téléchargement de Llama-3.1-8B, Mistral-7B et Qwen2.5-7B</text><rect x="20" y="261" width="200" height="28" class="W"/><text x="32" y="279.0" class="b">Deep learning</text><rect x="220" y="261" width="360" height="28" class="W"/><text x="232" y="279.0">PyTorch</text><rect x="580" y="261" width="440" height="28" class="W"/><text x="592" y="279.0">Calcul des tenseurs et entraînement</text><rect x="20" y="289" width="200" height="28" class="A"/><text x="32" y="307.0" class="b">Modèles</text><rect x="220" y="289" width="360" height="28" class="A"/><text x="232" y="307.0">Hugging Face Transformers</text><rect x="580" y="289" width="440" height="28" class="A"/><text x="592" y="307.0">Chargement du modèle et du tokenizer, early stopping</text><rect x="20" y="317" width="200" height="28" class="W"/><text x="32" y="335.0" class="b">Méthode d'affinage</text><rect x="220" y="317" width="360" height="28" class="W"/><text x="232" y="335.0">LoRA, avec la librairie PEFT</text><rect x="580" y="317" width="440" height="28" class="W"/><text x="592" y="335.0">Entraîne seulement des adaptateurs légers, pas tout le modèle</text><rect x="20" y="345" width="200" height="28" class="A"/><text x="32" y="363.0" class="b">Entraînement</text><rect x="220" y="345" width="360" height="28" class="A"/><text x="232" y="363.0">TRL (SFTTrainer, SFTConfig)</text><rect x="580" y="345" width="440" height="28" class="A"/><text x="592" y="363.0">Affinage supervisé par instruction</text><rect x="20" y="373" width="200" height="28" class="W"/><text x="32" y="391.0" class="b">Inférence</text><rect x="220" y="373" width="360" height="28" class="W"/><text x="232" y="391.0">Unsloth (FastLanguageModel)</text><rect x="580" y="373" width="440" height="28" class="W"/><text x="592" y="391.0">Chargement rapide du modèle affiné pour générer les réponses</text><rect x="20" y="401" width="200" height="28" class="A"/><text x="32" y="419.0" class="b">Quantification</text><rect x="220" y="401" width="360" height="28" class="A"/><text x="232" y="419.0">bitsandbytes (4 bits)</text><rect x="580" y="401" width="440" height="28" class="A"/><text x="592" y="419.0">Réduit la mémoire GPU pendant l'inférence</text><rect x="20" y="429" width="200" height="45" class="W"/><text x="32" y="455.5" class="b">Évaluation</text><rect x="220" y="429" width="360" height="45" class="W"/><text x="232" y="447.0">Sentence-Transformers, avec le modèle</text><text x="232" y="464.0">intfloat/multilingual-e5-base</text><rect x="580" y="429" width="440" height="45" class="W"/><text x="592" y="455.5">Similarité cosinus entre la prédiction et la référence</text><rect x="20" y="474" width="200" height="28" class="A"/><text x="32" y="492.0" class="b">Évaluation</text><rect x="220" y="474" width="360" height="28" class="A"/><text x="232" y="492.0">Ollama, avec le modèle bge-m3</text><rect x="580" y="474" width="440" height="28" class="A"/><text x="592" y="492.0">Embeddings pour la similarité et l'amélioration des prédictions</text><rect x="20" y="502" width="200" height="28" class="W"/><text x="32" y="520.0" class="b">Évaluation</text><rect x="220" y="502" width="360" height="28" class="W"/><text x="232" y="520.0">NumPy</text><rect x="580" y="502" width="440" height="28" class="W"/><text x="592" y="520.0">Calcul des métriques (précision, rappel, F1, cosinus)</text></svg>